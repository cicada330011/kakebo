<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827"><title>Kakebo — Money, mindfully</title>
<link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="layout">
<aside class="sidebar">
  <a class="brand" href="#"><span class="brand-icon">K</span><span>Kakebo<small>Money, mindfully</small></span></a>
  <nav id="desktop-nav">
    <button class="nav active" data-page="dashboard">⌂ <span>Dashboard</span></button>
    <button class="nav" data-page="wallets">▣ <span>Wallets</span></button>
    <button class="nav" data-page="savings">◈ <span>Savings</span></button>
    <button class="nav" data-page="loans">⇄ <span>Debt &amp; Loan</span></button>
    <button class="nav" data-page="ledger">☷ <span>Daily Ledger</span></button>
    <button class="nav" data-page="summary">▥ <span>Monthly Summary</span></button>
  </nav>
  <div class="sidebar-foot">● <span>Private on this device</span></div>
</aside>
<main>
<header class="topbar"><div><p id="today-label" class="muted tiny"></p><h1 id="page-title">Dashboard</h1></div>
<div class="top-actions"><button class="round" id="hide-balance" title="Hide balances">◉</button><button class="avatar" id="profile-menu">RF</button></div></header>
<div id="profile-popover" class="profile-popover hidden"><button data-page="settings">⚙ Settings</button><button data-page="settings">☾ Appearance</button><button data-page="settings">☁ Backup &amp; Restore</button></div>
<section id="view"></section>
</main>
</div>
<nav class="mobile-nav" id="mobile-nav">
<button class="active" data-page="dashboard">⌂<small>Home</small></button><button data-page="wallets">▣<small>Wallets</small></button><button data-page="savings">◈<small>Savings</small></button><button data-page="loans">⇄<small>Loans</small></button><button data-page="ledger">☷<small>Ledger</small></button>
</nav>
<dialog id="entry-dialog"><form id="entry-form"><div class="dialog-head"><div><p class="muted tiny">NEW ENTRY</p><h2 id="dialog-title">Add transaction</h2></div><button type="button" class="round" id="close-dialog">×</button></div><div id="entry-fields" class="form-grid"></div><div class="dialog-actions"><button type="button" class="btn ghost" id="cancel-entry">Cancel</button><button class="btn primary" type="submit">Save</button></div></form></dialog>
<script type="module" src="js/app.js"></script>
